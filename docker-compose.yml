services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/gwalior.osrm
    volumes:
      - ./osrm/data:/data
    ports:
      - "5000:5000"

  optimizer:
    build: ./optimizer
    environment:
      OSRM_URL: http://osrm:5000
    depends_on:
      - osrm
    ports:
      - "8001:8000"

  server:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      OSRM_URL: http://osrm:5000
      OPTIMIZER_URL: http://optimizer:8000
    depends_on:
      optimizer:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/data

  web:
    build:
      context: ./web
      args:
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
